<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fraction Simplifier — CalculatorPro</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>

    <link rel="stylesheet" href="../styles/theme.css" />
    <link rel="stylesheet" href="../styles/calculator.css" />
  </head>
  <body>
    <div class="bg-blob bg-blob-1"></div>
    <div class="bg-blob bg-blob-2"></div>

    <nav class="navbar">
      <a class="navbar-brand" href="../index.html">
        <span class="navbar-brand-icon">
          <span
            class="iconify"
            data-icon="tabler:calculator"
            data-width="28"
          ></span>
        </span>
        <span class="navbar-brand-name">CalculatorPro</span>
      </a>
      <span class="navbar-pill">Fraction Simplifier</span>
    </nav>

    <main class="calc-container">
      <div class="calc-header">
        <div class="calc-icon" style="background: #fde8d8">
          <span
            class="iconify"
            data-icon="tabler:divide"
            data-width="36"
            data-height="36"
            style="color: #c4601a"
          ></span>
        </div>
        <h1 class="calc-title">Fraction Simplifier</h1>
        <p class="calc-desc">
          Enter a fraction and get it in its simplest form.
        </p>
      </div>

      <div class="calc-card-single">
        <div class="fraction-input-row">
          <div class="fraction-box">
            <input
              type="number"
              id="numerator"
              class="calc-input fraction-num"
              placeholder="Numerator"
            />
            <div class="fraction-line"></div>
            <input
              type="number"
              id="denominator"
              class="calc-input fraction-den"
              placeholder="Denominator"
            />
          </div>
        </div>

        <button onclick="simplifyFraction()" class="calc-btn">
          <span
            class="iconify"
            data-icon="tabler:arrow-badge-down"
            data-width="18"
          ></span>
          Simplify Fraction
        </button>

        <div id="result-area" class="result-area"></div>
      </div>
    </main>

    <footer class="site-footer">Made for Class 6 &amp; 7 students</footer>

    <script src="../js/calculators/fractions.js"></script>
  </body>
</html>
