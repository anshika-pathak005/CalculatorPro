<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Even or Odd Checker- CalculatorPro</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Iconify CDN -->
  <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="../styles/theme.css" />
  <!-- common css file for all calculators -->
  <link rel="stylesheet" href="../styles/calculator.css" />
</head>

<body>
  <div class="bg-blob bg-blob-1"></div>
  <div class="bg-blob bg-blob-2"></div>

  <!-- Navbar -->
  <nav class="navbar">
    <a class="navbar-brand" href="../index.html">
      <span class="navbar-brand-icon">
        <span class="iconify" data-icon="tabler:calculator" data-width="28"></span>
      </span>
      <span class="navbar-brand-name">CalculatorPro</span>
    </a>
    <span class="navbar-pill">Even or Odd</span>
  </nav>

  <!-- Calculator Main Section -->
  <main class="calc-container">
    <div class="calc-header">
      <div class="calc-icon" style="background: #f0d8f5">
        <span class="iconify" data-icon="tabler:replace" data-width="36" data-height="36" style="color: #8a2ba0"></span>
      </div>
      <h1 class="calc-title">Even or Odd Checker</h1>
      <p class="calc-desc">
        Enter any whole number to check if it's even or odd.
      </p>
    </div>

    <div class="calc-card-single">
      <label class="input-label">
        <span class="iconify" data-icon="tabler:numbers" data-width="18"></span>
        Enter a number
      </label>
      <input type="number" id="eo-input" class="calc-input" placeholder="e.g., 42" />

      <button onclick="checkEvenOdd()" class="calc-btn">
        <span class="iconify" data-icon="tabler:check" data-width="18"></span>
        Check Now
      </button>

      <div id="result-area" class="result-area"></div>
    </div>
  </main>

  <footer class="site-footer">Made for Class 6 &amp; 7 students</footer>

  <script src="../js/calculators/even-odd.js"></script>
</body>

</html>
