<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pythagorean Theorem- CalculatorPro</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>

  <link rel="stylesheet" href="../styles/theme.css" />
  <link rel="stylesheet" href="../styles/calculator.css" />
</head>

<body>
  <div class="bg-blob bg-blob-1"></div>
  <div class="bg-blob bg-blob-2"></div>

  <nav class="navbar">
    <a class="navbar-brand" href="../index.html">
      <span class="navbar-brand-icon">
        <span class="iconify" data-icon="tabler:calculator" data-width="28"></span>
      </span>
      <span class="navbar-brand-name">CalculatorPro</span>
    </a>
    <span class="navbar-pill">Pythagoras Theorem</span>
  </nav>

  <main class="calc-container">
    <div class="calc-header">
      <div class="calc-icon" style="background: #e8e0f5">
        <span class="iconify" data-icon="tabler:triangle" data-width="36" data-height="36"
          style="color: #6e3482"></span>
      </div>
      <h1 class="calc-title">Pythagorean Theorem</h1>
      <p class="calc-desc">
        Calculate missing sides of right triangles ($a^2 + b^2 = c^2$), test Pythagorean triplets, perimeter, and area!
      </p>
    </div>

    <div class="calc-card-single">
      <!-- Visual Right Triangle Diagram -->
      <div class="flex justify-center my-3 bg-purple-50/50 py-3 rounded-2xl border border-purple-100/50">
        <svg width="200" height="130" viewBox="0 0 200 130" class="overflow-visible">
          <polygon points="30,100 170,100 30,20" fill="rgba(110, 52, 130, 0.08)" stroke="#6e3482" stroke-width="2.5"
            stroke-linejoin="round" />
          <rect x="30" y="85" width="15" height="15" fill="none" stroke="#8A2BA0" stroke-width="1.5" />
          <!-- Side Labels -->
          <text x="15" y="65" fill="#6e3482" font-size="13" font-weight="bold">a (leg)</text>
          <text x="95" y="118" fill="#6e3482" font-size="13" font-weight="bold">b (base)</text>
          <text x="110" y="55" fill="#8A2BA0" font-size="13" font-weight="bold">c (hypotenuse)</text>
        </svg>
      </div>

      <!-- Mode Tabs -->
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="sides" onclick="switchPythagorasTab('sides')">
          <span class="iconify" data-icon="tabler:ruler-2" data-width="16"></span>
          Find Side
        </button>
        <button class="tab-btn" data-tab="triplet" onclick="switchPythagorasTab('triplet')">
          <span class="iconify" data-icon="tabler:checkup-list" data-width="16"></span>
          Triplet Checker
        </button>
      </div>

      <!-- Panel 1: Find Side -->
      <div id="panel-sides" class="tab-panel">
        <label class="input-label">Select Side to Find</label>
        <select id="pyth-target" class="calc-input mb-3" onchange="updatePythFields()">
          <option value="c">Find Hypotenuse (c)</option>
          <option value="a">Find Leg (a)</option>
          <option value="b">Find Base (b)</option>
        </select>

        <div id="pyth-inputs" class="space-y-3">
          <!-- Dynamically rendered -->
        </div>

        <button onclick="calculatePythagoras()" class="calc-btn mt-4">
          <span class="iconify" data-icon="tabler:calculator" data-width="18"></span>
          Calculate Missing Side
        </button>
      </div>

      <!-- Panel 2: Triplet Checker -->
      <div id="panel-triplet" class="tab-panel hidden">
        <p class="text-xs text-gray-600 mb-3">Enter three positive numbers to test if a² + b² = c²:</p>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div>
            <label class="input-label">Side a</label>
            <input type="number" id="trip-a" class="calc-input" placeholder="e.g., 3" step="any" />
          </div>
          <div>
            <label class="input-label">Side b</label>
            <input type="number" id="trip-b" class="calc-input" placeholder="e.g., 4" step="any" />
          </div>
          <div>
            <label class="input-label">Side c (Largest)</label>
            <input type="number" id="trip-c" class="calc-input" placeholder="e.g., 5" step="any" />
          </div>
        </div>

        <button onclick="checkTriplet()" class="calc-btn mt-4">
          <span class="iconify" data-icon="tabler:circle-check" data-width="18"></span>
          Verify Triplet
        </button>
      </div>

      <div id="result-area" class="result-area"></div>
    </div>
  </main>

  <footer class="site-footer">Made for Class 7 &amp; 8 Math Students</footer>

  <script src="../js/calculators/pythagoras.js"></script>
</body>

</html>
