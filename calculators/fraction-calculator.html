<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fraction Calculator- CalculatorPro</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Iconify CDN -->
  <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="../styles/theme.css" />
  <link rel="stylesheet" href="../styles/calculator.css" />
  <link rel="stylesheet" href="../styles/fraction-calculator.css" />
</head>

<body>
  <div class="bg-blob bg-blob-1"></div>
  <div class="bg-blob bg-blob-2"></div>

  <!-- Navbar -->
  <nav class="navbar">
    <a class="navbar-brand" href="../index.html">
      <span class="navbar-brand-icon">
        <span class="iconify" data-icon="tabler:calculator" data-width="28"></span>
      </span>
      <span class="navbar-brand-name">CalculatorPro</span>
    </a>
    <span class="navbar-pill">Fraction Calculator</span>
  </nav>

  <!-- Calculator Main Section -->
  <main class="calc-container">
    <div class="calc-header">
      <div class="calc-icon" style="background: #fde8d8">
        <span class="iconify" data-icon="tabler:divide" data-width="36" data-height="36" style="color: #c4601a"></span>
      </div>
      <h1 class="calc-title">Fraction Calculator</h1>
      <p class="calc-desc">
        Add, subtract, multiply, and divide fractions. Supports decimals &amp;
        multiple fractions!
      </p>
    </div>

    <div class="calc-card-single">
      <!-- Operator Selector Row -->
      <div class="operator-row">
        <span class="operator-label">Operation</span>
        <div class="operator-buttons">
          <button class="op-btn active" data-op="+" onclick="setOperator('+')">
            +
          </button>
          <button class="op-btn" data-op="-" onclick="setOperator('-')">
            −
          </button>
          <button class="op-btn" data-op="×" onclick="setOperator('×')">
            ×
          </button>
          <button class="op-btn" data-op="÷" onclick="setOperator('÷')">
            ÷
          </button>
        </div>
      </div>

      <!-- Fractions List -->
      <div id="fractions-list" class="fractions-list"></div>

      <!-- Add Fraction Button -->
      <button onclick="addFraction()" class="add-fraction-btn">
        <span class="iconify" data-icon="tabler:plus" data-width="18"></span>
        Add Another Fraction
      </button>

      <!-- Result Preview Box -->
      <div class="result-preview-box" id="result-preview-box">
        <div class="preview-label">
          <span class="iconify" data-icon="tabler:eye" data-width="16"></span>
          Result Preview
        </div>
        <div class="preview-expression" id="preview-expression">—</div>
        <div class="preview-result" id="preview-result">
          <span class="placeholder">Enter values to see result</span>
        </div>
      </div>

      <!-- Detailed Result Area -->
      <div id="result-area" class="result-area"></div>

      <!-- Clear Button -->
      <button onclick="clearAll()" class="calc-btn-clear" style="margin-top: 1rem">
        <span class="iconify" data-icon="tabler:trash" data-width="18"></span>
        Clear All
      </button>
    </div>
  </main>

  <footer class="site-footer">Made for Class 6 &amp; 7 students</footer>

  <script src="../js/calculators/fraction-calculator.js"></script>
</body>

</html>
