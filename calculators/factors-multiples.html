<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Factors & Multiples- CalculatorPro</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>

  <link rel="stylesheet" href="../styles/theme.css" />
  <link rel="stylesheet" href="../styles/calculator.css" />
</head>

<body>
  <div class="bg-blob bg-blob-1"></div>
  <div class="bg-blob bg-blob-2"></div>

  <nav class="navbar">
    <a class="navbar-brand" href="../index.html">
      <span class="navbar-brand-icon">
        <span class="iconify" data-icon="tabler:calculator" data-width="28"></span>
      </span>
      <span class="navbar-brand-name">CalculatorPro</span>
    </a>
    <span class="navbar-pill">Factors & Multiples</span>
  </nav>

  <main class="calc-container">
    <div class="calc-header">
      <div class="calc-icon" style="background: #fdf0d8">
        <span class="iconify" data-icon="tabler:multiplication" data-width="36" data-height="36"
          style="color: #b07010"></span>
      </div>
      <h1 class="calc-title">Factors & Multiples</h1>
      <p class="calc-desc">
        Find all factors of a number, or generate the first N multiples.
      </p>
    </div>

    <!-- Factors Section -->
    <div class="calc-card-single">
      <div class="section-title">
        <span class="iconify" data-icon="tabler:list" data-width="20"></span>
        Find Factors
      </div>
      <label class="input-label">Number</label>
      <input type="number" id="factor-input" class="calc-input" placeholder="e.g., 36" />

      <button onclick="findFactors()" class="calc-btn">
        <span class="iconify" data-icon="tabler:list-search" data-width="18"></span>
        List All Factors
      </button>

      <div id="factor-result" class="result-area"></div>
    </div>

    <!-- Multiples Section -->
    <div class="calc-card-single">
      <div class="section-title">
        <span class="iconify" data-icon="tabler:repeat" data-width="20"></span>
        Generate Multiples
      </div>
      <label class="input-label">Number</label>
      <input type="number" id="multiple-input" class="calc-input" placeholder="e.g., 7" />

      <label class="input-label mt-3">How many multiples?</label>
      <input type="number" id="count-input" class="calc-input" placeholder="e.g., 10" value="10" />

      <button onclick="findMultiples()" class="calc-btn">
        <span class="iconify" data-icon="tabler:list-numbers" data-width="18"></span>
        Generate Multiples
      </button>

      <div id="multiple-result" class="result-area"></div>
    </div>
  </main>

  <footer class="site-footer">Made for Class 6 &amp; 7 students</footer>

  <script src="../js/calculators/factors-multiples.js"></script>
</body>

</html>
