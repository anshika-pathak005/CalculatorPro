<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unit Converter — MathHelper</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Iconify CDN -->
  <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="../styles/theme.css" />
  <link rel="stylesheet" href="../styles/calculator.css" />
  <link rel="stylesheet" href="../styles/unit-converter.css" />
</head>
<body>

  <div class="bg-blob bg-blob-1"></div>
  <div class="bg-blob bg-blob-2"></div>

  <!-- Navbar -->
  <nav class="navbar">
    <a class="navbar-brand" href="../index.html">
      <span class="navbar-brand-icon">
        <span class="iconify" data-icon="tabler:calculator" data-width="28"></span>
      </span>
      <span class="navbar-brand-name">MathHelper</span>
    </a>
    <span class="navbar-pill">Unit Converter</span>
  </nav>

  <!-- Calculator Main Section -->
  <main class="calc-container">
    <div class="calc-header">
      <div class="calc-icon" style="background: #E8E0F5">
        <span class="iconify" data-icon="tabler:arrows-exchange" data-width="36" data-height="36" style="color: #6E3482"></span>
      </div>
      <h1 class="calc-title">Unit Converter</h1>
      <p class="calc-desc">Convert between Length, Weight, Volume, and Time units easily.</p>
    </div>

    <div class="calc-card-single">
      <!-- Category Tabs -->
      <div class="category-tabs">
        <button class="cat-tab active" data-cat="length" onclick="switchCategory('length')">
          <span class="iconify" data-icon="tabler:ruler" data-width="18"></span>
          Length
        </button>
        <button class="cat-tab" data-cat="weight" onclick="switchCategory('weight')">
          <span class="iconify" data-icon="tabler:weight" data-width="18"></span>
          Weight
        </button>
        <button class="cat-tab" data-cat="volume" onclick="switchCategory('volume')">
          <span class="iconify" data-icon="tabler:droplet" data-width="18"></span>
          Volume
        </button>
        <button class="cat-tab" data-cat="time" onclick="switchCategory('time')">
          <span class="iconify" data-icon="tabler:clock" data-width="18"></span>
          Time
        </button>
      </div>

      <!-- Conversion Section -->
      <div class="conversion-section">
        <div class="input-group">
          <label class="input-label">
            <span class="iconify" data-icon="tabler:arrow-right" data-width="16"></span>
            From
          </label>
          <select id="from-unit" class="unit-select"></select>
        </div>

        <div class="swap-icon">
          <button onclick="swapUnits()" class="swap-unit-btn">
            <span class="iconify" data-icon="tabler:arrows-exchange" data-width="24"></span>
          </button>
        </div>

        <div class="input-group">
          <label class="input-label">
            <span class="iconify" data-icon="tabler:arrow-left" data-width="16"></span>
            To
          </label>
          <select id="to-unit" class="unit-select"></select>
        </div>
      </div>

      <!-- Value Input -->
      <div class="value-section">
        <div class="input-group full-width">
          <label class="input-label">
            <span class="iconify" data-icon="tabler:numbers" data-width="16"></span>
            Enter Value
          </label>
          <input type="number" id="input-value" class="calc-input value-input" placeholder="e.g., 100" value="1" step="any" />
        </div>
      </div>

      <!-- Result Preview Box -->
      <div class="result-preview-box" id="result-preview-box">
        <div class="preview-label">
          <span class="iconify" data-icon="tabler:eye" data-width="16"></span>
          Converted Result
        </div>
        <div class="preview-result" id="preview-result">
          <span class="placeholder">Enter value to convert</span>
        </div>
      </div>

      <!-- Detailed Result Area -->
      <div id="result-area" class="result-area"></div>

      <!-- Clear Button -->
      <button onclick="clearConverter()" class="calc-btn-clear" style="margin-top: 1rem;">
        <span class="iconify" data-icon="tabler:trash" data-width="18"></span>
        Clear All
      </button>
    </div>
  </main>

  <footer class="site-footer">
    Made for Class 6 &amp; 7 students
  </footer>

  <script src="../js/calculators/unit-converter.js"></script>
</body>
</html>
